<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8f5">
  <title>Grimoire - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/png" href="./assets/grimoire-mark.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="startup-screen" id="startup-screen" role="status" aria-live="polite">
    <div class="startup-card">
      <span class="startup-spark startup-spark-one" aria-hidden="true">✦</span>
      <span class="startup-spark startup-spark-two" aria-hidden="true">✧</span>
      <div class="startup-book" aria-hidden="true">
        <div class="startup-book-pages">
          <span class="startup-book-page startup-book-page-left"></span>
          <span class="startup-book-page startup-book-page-right"></span>
        </div>
        <span class="startup-book-spine"></span>
        <div class="startup-book-cover"><img src="./assets/grimoire-mark.png" alt=""></div>
      </div>
      <span class="startup-brand">GRIMOIRE STUDY CLUB</span>
      <p class="startup-greeting">Hey, buddy! <span aria-hidden="true">✦</span></p>
      <p class="startup-caption">Your little study nook is getting ready.</p>
      <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="./assets/grimoire-logo.png" alt="Grimoire">
    </div>

    <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">
      <span class="material-symbols-outlined">close</span>
    </button>

    <nav class="sidebar-nav" aria-label="Primary navigation">
      <a class="nav-link active" href="#dashboard" data-route="dashboard">
        <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="#upload" data-route="upload">
        <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
        <span>Upload PDF</span>
      </a>
      <a class="nav-link" href="#quiz" data-route="quiz">
        <span class="material-symbols-outlined" aria-hidden="true">quiz</span>
        <span>Active Quiz</span>
      </a>
      <a class="nav-link" href="#results" data-route="results">
        <span class="material-symbols-outlined" aria-hidden="true">emoji_events</span>
        <span>Results</span>
      </a>
      <a class="nav-link" href="#history" data-route="history">
        <span class="material-symbols-outlined" aria-hidden="true">history</span>
        <span>History</span>
      </a>
      <a class="nav-link" href="#profile" data-route="profile" id="profile-nav-link" hidden>
        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
        <span>Student profile</span>
      </a>
    </nav>
    <button class="button button-neutral button-wide sidebar-signout" id="sidebar-signout" type="button" hidden>
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>Sign out
    </button>

    <div class="system-status">
      <span>SYSTEM</span>
      <span class="status-name" id="system-status-name">CHECKING</span>
      <span class="status-dot" id="system-status-dot"></span>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-shell">
    <header class="topbar">
      <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="build-tag">GRIMOIRE / 1.0</span>
      <a class="student-chip" id="student-chip" href="#profile" hidden>
        <span class="student-avatar" id="student-avatar">S</span>
        <span id="student-chip-name">Student</span>
      </a>
      <span class="topbar-mark" aria-hidden="true"><img src="./assets/grimoire-mark.png" alt=""></span>
    </header>

    <main class="main-content" id="app">
      <div class="loading-page" role="status">
        <span class="material-symbols-outlined spinning">progress_activity</span>
        Loading dashboard
      </div>
    </main>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
